name: EduManage - Security Pipeline

on:
  push:
    branches:
      - websec
  pull_request:
    branches:
      - websec

jobs:

  # ─────────────────────────────────────────
  # JOB 1 : Analyse du code backend (Java)
  # ─────────────────────────────────────────
  sast-backend:
    name: Analyse sécurité Backend (SonarCloud)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compiler et analyser avec SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -DskipTests=true

  # ─────────────────────────────────────────
  # JOB 2 : Scan des dépendances dangereuses
  # ─────────────────────────────────────────
  dependency-scan:
    name: Scan dépendances (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Scanner les dépendances avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Exporter le rapport Trivy en JSON
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Sauvegarder le rapport Trivy
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  # ─────────────────────────────────────────
  # JOB 3 : Détection de secrets exposés
  # ─────────────────────────────────────────
  secrets-scan:
    name: Détection secrets exposés (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scanner les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}