server:
  port: 8082
  forward-headers-strategy: framework
  servlet:
    context-path: /api/

cloudinary:    # serveur pour la gestion des images de la formation
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  application:
    name: edumanage

springdoc:
  api-docs:
    enabled: true
    path: /v1/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: prometheus,health
  endpoint:
    prometheus:
      enabled: true
    health:
      enabled: true
---
spring:
  config:
    activate:
      on-profile: dev
    import: classpath:logs-dev.yml
---
spring:
  config:
    activate:
      on-profile: prod
    import: classpath:logs-prod.yml